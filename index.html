<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input class="inp" type="text" placeholder="inter city name" spellcheck="false">
            <button class="btn" img src="search.png">search</button>
        </div>
    
    <div class="weather">
        <img src="weather.jpeg" class="weather-icon">
        <h1 class="temp">22℃</h1>
        <h2 class="city">New York</h2>
        <div class="col">
            <img src="humidity.jpg">
            <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
            </div>
        </div>
        <div class="col">
            
        </div>
        <p class="wind">15 km/h</p>
        <p>Wind Speed</p>
    </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
